<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Anime Store</title>
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="icon" href="../assets/logoicon.jpg">
</head>
<body>
    <header>
        <a href="index.html" class="brand-wrapper">
            <img src="../assets/logoicon.jpg" alt="Anime Store Logo">
            <span class="brand-text">アニメ STORE</span>
        </a>
        <nav>
            <ol>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li class="active"><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ol>
        </nav>
    </header>

    <main class="page-container">
        <div class="auth-wrapper">
            <div class="auth-header">
                <h2>Welcome Back!</h2>
                <p>Sign in to access your cart, wishlist, and past orders</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="ninja@animestore.com" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
                </div>

                <button type="submit" id="login-submit-btn" class="auth-submit-btn">
                    Sign In
                </button>
            </form>

            <div class="auth-switch">
                Don't have an account yet? <a href="register.html">Register here</a>
            </div>

            <div style="margin-top:20px; font-size:12px; color:#c9bcaf; text-align:center; background:rgba(255,255,255,0.05); padding:10px; border-radius:10px;">
                💡 <em>Quick Demo Credentials:</em> <code>demo@animestore.com</code> / <code>demo123</code>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
